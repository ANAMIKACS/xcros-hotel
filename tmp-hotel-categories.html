<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-header">
                <div class="flex-space-between">
                    <div>
                        <h5>Hotel Categories</h5>
                    </div>
                    <div>
                        <button type="button" class="btn btn-primary" (click)="openAdd()">Add New Category</button>
                    </div>
                </div>
            </div>
            
            <div class="card-body">
                <div class="customtable">
                    <table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="row-border hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Image</th>
                                <th>Icon</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of datalist">
                                <td>{{ item.name }}</td>
                                <td>
                                    <img [src]="getImageUrl(item.image)" style="width: 50px; height: 50px; object-fit: cover;" class="img-thumbnail">
                                </td>
                                <td>{{ item.icon || '-' }}</td>
                                <td>
                                    <button class="btn btn-primary btn-sm" (click)="openEdit(item)">Edit</button>
                                </td>
                                <td>
                                    <button class="btn btn-danger btn-sm" (click)="delete(item._id)">Delete</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Modal -->
<ng-template #addModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Add Category</h5>
        <button type="button" class="close" (click)="modal.dismiss()"><span>&times;</span></button>
    </div>
    <div class="modal-body">
        <form [formGroup]="addForm" (ngSubmit)="submitAdd()">
            <div class="mb-3">
                <label>Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="name">
            </div>
            <div class="mb-3">
                <label>Image <span class="text-danger">*</span></label>
                <div class="d-flex align-items-center">
                    <img [src]="getImageUrl(addForm.get('image')?.value)" style="width: 80px; height: 80px; margin-right: 15px;" class="img-thumbnail">
                    <button type="button" class="btn btn-outline-primary btn-sm" (click)="openMedia('add')">Select Image</button>
                </div>
            </div>
            <div class="mb-3">
                <label>Icon Class (optional)</label>
                <input type="text" class="form-control" formControlName="icon" placeholder="e.g. hotel">
            </div>
            <div class="text-right mt-3">
                <button type="button" class="btn btn-secondary mr-2" (click)="modal.dismiss()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Category</button>
            </div>
        </form>
    </div>
</ng-template>

<!-- Edit Modal -->
<ng-template #editModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Edit Category</h5>
        <button type="button" class="close" (click)="modal.dismiss()"><span>&times;</span></button>
    </div>
    <div class="modal-body">
        <form [formGroup]="editForm" (ngSubmit)="submitEdit()">
            <div class="mb-3">
                <label>Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="name">
            </div>
            <div class="mb-3">
                <label>Image <span class="text-danger">*</span></label>
                <div class="d-flex align-items-center">
                    <img [src]="getImageUrl(editForm.get('image')?.value)" style="width: 80px; height: 80px; margin-right: 15px;" class="img-thumbnail">
                    <button type="button" class="btn btn-outline-primary btn-sm" (click)="openMedia('edit')">Change Image</button>
                </div>
            </div>
            <div class="mb-3">
                <label>Icon Class (optional)</label>
                <input type="text" class="form-control" formControlName="icon">
            </div>
            <div class="text-right mt-3">
                <button type="button" class="btn btn-secondary mr-2" (click)="modal.dismiss()">Cancel</button>
                <button type="submit" class="btn btn-primary">Update Category</button>
            </div>
        </form>
    </div>
</ng-template>

<!-- Media Template -->
<ng-template #media let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Media Library</h5>
        <button type="button" class="close" (click)="modal.dismiss()"><span>&times;</span></button>
    </div>
    <div class="modal-body">
        <app-media (newItemEvent)="getSelectedImgs($event)"></app-media>
    </div>
</ng-template>
